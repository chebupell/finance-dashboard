<aside class="sidebar">
  <nav class="sidebar-nav" aria-label="Dashboard navigation">
    <a class="nav-item" [class.nav-item--active]="activeNav() === 'dashboard'" href="#" (click)="onNavClick($event, 'dashboard')">{{ t('nav.dashboard') }}</a>
    <a class="nav-item" [class.nav-item--active]="activeNav() === 'transactions'" href="#" (click)="onNavClick($event, 'transactions')">{{ t('nav.transactions') }}</a>
    <a class="nav-item" [class.nav-item--active]="activeNav() === 'goals'" href="#" (click)="onNavClick($event, 'goals')">{{ t('nav.goals') }}</a>
    <a class="nav-item" [class.nav-item--active]="activeNav() === 'settings'" href="#" (click)="onNavClick($event, 'settings')">{{ t('nav.settings') }}</a>
  </nav>

  <div class="sidebar-user">
    <img [src]="auth.avatarUrl()" [alt]="t('settings.avatar')" />
    <div>
      <p class="name">{{ auth.userData()?.name }}</p>
      <p class="mail">{{ auth.userData()?.email }}</p>
    </div>
  </div>
</aside>
